<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>swipetris</title>
  <meta name="theme-color" content="#0f1115">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module">
    import { boot, startGame, setTheme, dailySeed } from "/app.js";
    boot();

    document.addEventListener("alpine:init", () => {
      Alpine.data("ui", () => ({
        mode: "daily",
        theme: localStorage.getItem("swipetris-theme") ?? "colorful",
        state: "menu",
        sheet: false,
        score: 0, lines: 0, level: 1,
        name: localStorage.getItem("swipetris-name") ?? "",
        leaderboard: [],
        shared: false, submitted: false, rankText: "",
        lastResult: null,

        init() {
          setTheme(this.theme);
          window.addEventListener("stats", (e) => {
            this.score = e.detail.score; this.lines = e.detail.lines; this.level = e.detail.level;
          });
          window.addEventListener("gameover", async (e) => {
            this.lastResult = e.detail;
            this.state = "over";
            this.shared = false; this.submitted = false;
            await this.loadBoard();
          });
        },
        pickTheme(t) {
          this.theme = t;
          localStorage.setItem("swipetris-theme", t);
          setTheme(t);
        },
        play() {
          this.state = "playing";
          startGame(this.mode);
        },
        async share() {
          const r = this.lastResult;
          const label = r.mode === "daily" ? `Daily ${new Date().toISOString().slice(0,10)}` : "Endless";
          const text = `swipetris ${label}\n${r.score.toLocaleString()} pts · ${r.lines} lines · lv ${r.level}\nhttps://swipetris.com`;
          if (navigator.share) {
            try { await navigator.share({ text }); this.shared = true; return; } catch {}
          }
          await navigator.clipboard.writeText(text);
          this.shared = true;
        },
        async submitScore() {
          const r = this.lastResult;
          localStorage.setItem("swipetris-name", this.name);
          const res = await fetch("/api/score", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name: this.name, ...r }),
          });
          if (res.ok) {
            const { rank } = await res.json();
            this.submitted = true;
            this.rankText = `#${rank}`;
            await this.loadBoard();
          }
        },
        async loadBoard() {
          const r = this.lastResult;
          const seed = r.mode === "daily" ? dailySeed() : r.seed;
          const res = await fetch(`/api/leaderboard?mode=${r.mode}&seed=${seed}`);
          if (res.ok) this.leaderboard = (await res.json()).leaderboard;
        },
      }));
    });
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="theme-colorful" x-data="ui">

  <div id="app">
    <header>
      <div class="modes">
        <button :class="{active: mode==='daily'}" @click="mode='daily'">Daily</button>
        <button :class="{active: mode==='endless'}" @click="mode='endless'">Endless</button>
      </div>
      <div class="themes">
        <template x-for="t in ['colorful','pastels','catppuccin','crt']" :key="t">
          <button class="swatch" :class="[t, {active: theme===t}]" @click="pickTheme(t)" :title="t"></button>
        </template>
      </div>
    </header>

    <main>
      <div id="game-wrap">
        <div id="clear-flash"></div>
        <div id="crt-overlay"></div>

        <div id="hud">
          <div class="hud-left">
            <b x-text="score.toLocaleString()">0</b>
            <span><em x-text="lines">0</em> lines · lv <em x-text="level">1</em></span>
          </div>
          <div class="hud-next">
            <span>Next</span>
            <canvas id="next-canvas" width="64" height="64"></canvas>
          </div>
        </div>
        <div id="hud-pops"></div>

        <div class="overlay menu" x-show="state==='menu'" x-transition>
          <canvas id="logo-canvas" width="192" height="192"></canvas>
          <div class="menu-title">swipetris</div>
          <p class="tagline">swipe. stack. repeat.</p>
          <button class="big" @click="play()">Play <span x-text="mode"></span></button>
          <p class="hint">drag to move · tap to rotate · flick down to drop</p>
        </div>

        <div class="overlay over" x-show="state==='over'" x-transition>
          <span class="over-label">Game over</span>
          <div class="over-score" x-text="score.toLocaleString()">0</div>
          <div class="over-chips">
            <span class="chip"><b x-text="lines"></b> lines</span>
            <span class="chip">lv <b x-text="level"></b></span>
            <span class="chip"><b x-text="lastResult ? lastResult.pieces : 0"></b> pcs</span>
          </div>

          <form x-show="!submitted" @submit.prevent="submitScore()">
            <input x-model="name" maxlength="12" placeholder="name" required>
            <button type="submit">Save</button>
          </form>
          <div class="rank-chip" x-show="submitted" x-text="rankText + ' on the board'"></div>

          <ol class="board-list" x-show="leaderboard.length">
            <template x-for="(r, i) in leaderboard" :key="r.id">
              <li>
                <span class="rank" :class="'r'+(i+1)" x-text="i+1"></span>
                <span class="nm" x-text="r.name"></span>
                <b x-text="r.score.toLocaleString()"></b>
              </li>
            </template>
          </ol>

          <div class="over-actions">
            <button class="big" @click="play()">Play again</button>
            <button class="ghost" @click="share()" x-text="shared ? 'Copied!' : 'Share score'"></button>
          </div>
        </div>
      </div>
    </main>

    <button id="fab" :class="{open: sheet}" @click="sheet = !sheet" aria-label="Options">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="21" x2="14" y1="4" y2="4"/><line x1="10" x2="3" y1="4" y2="4"/>
        <line x1="21" x2="12" y1="12" y2="12"/><line x1="8" x2="3" y1="12" y2="12"/>
        <line x1="21" x2="16" y1="20" y2="20"/><line x1="12" x2="3" y1="20" y2="20"/>
        <line x1="14" x2="14" y1="2" y2="6"/><line x1="8" x2="8" y1="10" y2="14"/>
        <line x1="16" x2="16" y1="18" y2="22"/>
      </svg>
    </button>

    <div id="sheet-backdrop" x-show="sheet" x-transition.opacity @click="sheet = false"></div>
    <div id="sheet" x-show="sheet"
      x-transition:enter="sheet-enter"
      x-transition:enter-start="sheet-hidden"
      x-transition:enter-end="sheet-shown"
      x-transition:leave="sheet-leave"
      x-transition:leave-start="sheet-shown"
      x-transition:leave-end="sheet-hidden">
      <div class="sheet-card">
        <div class="grabber"></div>
        <div class="sheet-section">
          <span class="sheet-label">Mode</span>
          <div class="modes">
            <button :class="{active: mode==='daily'}" @click="mode='daily'">Daily</button>
            <button :class="{active: mode==='endless'}" @click="mode='endless'">Endless</button>
          </div>
        </div>
        <div class="sheet-section">
          <span class="sheet-label">Theme</span>
          <div class="theme-grid">
            <template x-for="t in ['colorful','pastels','catppuccin','crt']" :key="t">
              <button class="theme-opt" :class="{active: theme===t}" @click="pickTheme(t)">
                <span class="swatch" :class="t"></span><span x-text="t"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator && location.hostname !== "localhost") {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
