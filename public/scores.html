<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>daily scores — swipetris</title>
  <meta name="description" content="The winning runs from every swipetris daily board.">
  <meta name="theme-color" content="#0f1115">
  <meta property="og:title" content="daily scores — swipetris">
  <meta property="og:description" content="The winning runs from every swipetris daily board.">
  <meta property="og:image" content="https://swipetris.com/og.png">
  <meta property="og:url" content="https://swipetris.com/scores">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="stylesheet" href="/landing.css?v=17">
  <style>
    .scores-wrap { max-width: 560px; margin: 0 auto; padding: 40px 20px calc(40px + env(safe-area-inset-bottom)); }
    .scores-head { text-align: center; margin-bottom: 38px; }
    .scores-head .logo { font-size: clamp(20px, 6vw, 30px); }
    .scores-head .tagline { margin-top: 14px; }
    .scores-title { margin-top: 36px; font-family: var(--pixel); font-size: clamp(14px, 4.2vw, 19px); line-height: 1.7; color: var(--cyan); text-shadow: 0 0 14px rgba(34, 211, 238, .4); }
    .scores-intro { margin: 12px auto 0; max-width: 360px; color: var(--dim); font-size: 13px; line-height: 1.7; }
    .scores-key { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 0 16px 10px; font-family: var(--pixel); font-size: 8px; color: var(--dim); letter-spacing: .08em; }
    .score-days { border-top: 1px solid var(--line); }
    .score-day { border-bottom: 1px solid var(--line); }
    .score-day summary { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 12px; list-style: none; cursor: pointer; padding: 17px 16px; color: var(--ink); }
    .score-day summary::-webkit-details-marker { display: none; }
    .score-day summary::before { content: ">"; color: var(--cyan); font-family: var(--pixel); font-size: 11px; line-height: 1; transition: transform .15s ease; }
    .score-day[open] summary::before { transform: rotate(90deg); }
    .score-date, .score-high { font-family: var(--pixel); font-size: 10px; line-height: 1.7; }
    .score-high { color: var(--yellow); text-align: right; text-shadow: 0 0 10px rgba(250, 204, 21, .25); }
    .score-top { padding: 0 16px 15px; }
    .score-top ol { list-style: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--bg-deep); }
    .score-top li { display: flex; align-items: center; gap: 12px; padding: 10px 12px; font-family: var(--pixel); font-size: 9px; }
    .score-top li + li { border-top: 1px solid rgba(255, 255, 255, .05); }
    .score-rank { width: 14px; color: var(--dim); }
    .score-top li:nth-child(1) .score-rank { color: var(--yellow); }
    .score-top li:nth-child(2) .score-rank { color: var(--cyan); }
    .score-top li:nth-child(3) .score-rank { color: var(--orange); }
    .score-name { letter-spacing: .22em; }
    .score-points { margin-left: auto; color: var(--dim); font-weight: 400; }
    .score-empty { padding: 24px 8px; text-align: center; color: var(--dim); font-size: 13px; line-height: 1.7; }
    .score-error { color: var(--red); }
    .scores-cta { text-align: center; padding: 38px 0 10px; }
    .scores-cta .cta { margin-top: 0; }
    .back { display: block; text-align: center; margin-top: 22px; font-size: 12px; color: var(--dim); }
    .back a { color: var(--cyan); text-decoration: none; border-bottom: 1px dashed color-mix(in srgb, var(--cyan) 55%, transparent); }
    @media (prefers-reduced-motion: reduce) { .score-day summary::after { transition: none; } }
  </style>
</head>
<body>
  <div class="scanlines" aria-hidden="true"></div>

  <main class="scores-wrap">
    <header class="scores-head">
      <div class="brand-lockup">
        <div class="brand-block" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
        <h1 class="logo" aria-label="swipetris">
          <span class="l1">S</span><span class="l2">W</span><span class="l3">I</span><span class="l4">P</span><span class="l5">E</span><span class="l6">T</span><span class="l7">R</span><span class="l1">I</span><span class="l2">S</span>
        </h1>
      </div>
      <p class="tagline">SWIPE. STACK. REPEAT.</p>
      <h2 class="scores-title">DAILY SCORES</h2>
      <p class="scores-intro">Every board has the same piece sequence. Here are the runs that came out on top.</p>
    </header>

    <div class="scores-key" aria-hidden="true"><span>DATE</span><span>HI SCORE</span></div>
    <section class="score-days" id="score-days" aria-live="polite">
      <p class="score-empty">Loading the score archive&hellip;</p>
    </section>

    <div class="scores-cta">
      <a class="cta" href="/play#go"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7V5Z"/></svg><span>PLAY TODAY</span></a>
      <p class="back">want the rules? <a href="/about">what is swipetris?</a></p>
    </div>
  </main>

  <script type="module" src="/scores.js?v=14"></script>
  <script type="module" src="/bg.js?v=14"></script>
  <script>
    if ("serviceWorker" in navigator && location.hostname !== "localhost") navigator.serviceWorker.register("/sw.js?v=21", { updateViaCache: "none" });
  </script>
</body>
</html>
