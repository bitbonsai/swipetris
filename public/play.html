<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>swipetris</title>
  <meta name="theme-color" content="#0f1115">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="swipetris">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Press+Start+2P&display=swap">
  <link rel="stylesheet" href="/style.css">
  <script type="module">
    import Alpine from "/vendor/alpinejs.esm.js";
    import { boot, startGame, setTheme, setMuted, dailySeed } from "/app.js";

    window.Alpine = Alpine;
    Alpine.data("ui", () => ({
        theme: localStorage.getItem("swipetris-theme") ?? "colorful",
        state: "menu",
        sheet: false,
        gestureHint: false,
        settingsHintSeen: false,
        hintTimer: null,
        score: 0, lines: 0, level: 1,
        name: (localStorage.getItem("swipetris-name") ?? "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 5),
        leaderboard: [],
        shared: false, submitted: false, rankText: "",
        lastResult: null,
        muted: localStorage.getItem("swipetris-muted") === "1",
        bestTick: 0, newBest: false, countdown: "",

        get best() {
          this.bestTick;
          return Number(localStorage.getItem("swipetris-best") || 0);
        },

        init() {
          setTheme(this.theme);
          setMuted(this.muted);
          const tickCountdown = () => {
            const now = new Date();
            const midnight = new Date(now);
            midnight.setHours(24, 0, 0, 0);
            const ms = midnight - now;
            this.countdown = `${Math.floor(ms / 3600000)}h ${Math.floor(ms / 60000) % 60}m`;
          };
          tickCountdown();
          setInterval(tickCountdown, 30000);
          window.addEventListener("stats", (e) => {
            this.score = e.detail.score; this.lines = e.detail.lines; this.level = e.detail.level;
          });
          window.addEventListener("gameover", async (e) => {
            this.lastResult = e.detail;
            this.state = "over";
            this.gestureHint = false;
            this.shared = false; this.submitted = false;
            this.newBest = e.detail.score > 0 && e.detail.score > this.best;
            if (this.newBest) {
              localStorage.setItem("swipetris-best", String(e.detail.score));
              this.bestTick++;
            }
            await this.loadBoard();
          });
          window.addEventListener("settings", () => {
            this.sheet = true;
            this.gestureHint = false;
          });
        },
        setSound(on) {
          this.muted = !on;
          setMuted(this.muted);
        },
        pickTheme(t) {
          this.theme = t;
          localStorage.setItem("swipetris-theme", t);
          setTheme(t);
        },
        play() {
          this.state = "playing";
          this.sheet = false;
          startGame();
          if (!this.settingsHintSeen) {
            this.settingsHintSeen = true;
            this.gestureHint = true;
            clearTimeout(this.hintTimer);
            this.hintTimer = setTimeout(() => { this.gestureHint = false; }, 4200);
          }
        },
        async share() {
          const r = this.lastResult;
          const s = String(dailySeed());
          const label = `Daily ${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6)}`;
          const text = `swipetris ${label}\n${r.score.toLocaleString()} pts · ${r.lines} lines · lv ${r.level}\nhttps://swipetris.com`;
          if (navigator.share) {
            try { await navigator.share({ text }); this.shared = true; return; } catch {}
          }
          await navigator.clipboard.writeText(text);
          this.shared = true;
        },
        async submitScore() {
          const r = this.lastResult;
          localStorage.setItem("swipetris-name", this.name);
          const res = await fetch("/api/score", {
            method: "POST",
            headers: { "content-type": "application/json" },
            body: JSON.stringify({ name: this.name, ...r }),
          });
          if (res.ok) {
            const { rank } = await res.json();
            this.submitted = true;
            this.rankText = `#${rank}`;
            await this.loadBoard();
          }
        },
        async loadBoard() {
          const res = await fetch(`/api/leaderboard?mode=daily&seed=${dailySeed()}`);
          if (res.ok) this.leaderboard = (await res.json()).leaderboard;
        },
      }));
    Alpine.start();
    boot();
  </script>
</head>
<body class="theme-colorful" x-data="ui">

  <div class="scanlines" aria-hidden="true"></div>

  <div id="app">
    <main>
      <div id="game-wrap">
        <div id="clear-flash"></div>
        <div id="crt-overlay"></div>

        <div id="hud">
          <div class="hud-left">
            <b x-text="score.toLocaleString()">0</b>
            <span><em x-text="lines">0</em> lines · lv <em x-text="level">1</em></span>
          </div>
          <div class="hud-next">
            <span>NEXT</span>
            <canvas id="next-canvas" width="64" height="64"></canvas>
          </div>
        </div>
        <div id="hud-pops"></div>
        <div id="settings-swipe-hint" x-cloak x-show="gestureHint && state === 'playing'" x-transition.opacity aria-live="polite">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12 18V6m0 0-5 5m5-5 5 5"/></svg>
          <span>SWIPE UP FOR SETTINGS</span>
        </div>

        <div class="overlay menu" x-show="state==='menu'" x-transition>
          <canvas id="logo-canvas" width="192" height="192"></canvas>
          <div class="menu-title"><span>s</span><span>w</span><span>i</span><span>p</span><span>e</span><span>t</span><span>r</span><span>i</span><span>s</span></div>
          <p class="tagline">swipe. stack. repeat.</p>
          <button class="big" @click="play()">PLAY DAILY CHALLENGE</button>
          <p class="menu-meta" x-show="best > 0">BEST <b x-text="best.toLocaleString()"></b></p>
          <p class="menu-meta dim">new daily in <span x-text="countdown"></span></p>
          <p class="hint">drag to move · tap to rotate · flick down to drop</p>
          <a class="about-link" href="/">what is swipetris?</a>
        </div>

        <div class="overlay over" x-show="state==='over'" x-transition>
          <span class="over-label">Game over</span>
          <div class="over-score" x-text="score.toLocaleString()">0</div>
          <div class="new-best" x-show="newBest">&#9733; NEW BEST &#9733;</div>
          <div class="over-chips">
            <span class="chip"><b x-text="lines"></b> lines</span>
            <span class="chip">lv <b x-text="level"></b></span>
            <span class="chip"><b x-text="lastResult ? lastResult.pieces : 0"></b> pcs</span>
          </div>

          <form x-show="!submitted" @submit.prevent="submitScore()">
            <input class="initials" x-model="name" @input="name = name.toUpperCase().replace(/[^A-Z0-9]/g, '')"
              maxlength="5" placeholder="PLAYER" autocomplete="off" required>
            <button type="submit">Save</button>
          </form>
          <div class="rank-chip" x-show="submitted" x-text="rankText + ' on the board'"></div>

          <ol class="board-list" x-show="leaderboard.length">
            <template x-for="(r, i) in leaderboard" :key="r.id">
              <li>
                <span class="rank" :class="'r'+(i+1)" x-text="i+1"></span>
                <span class="nm" x-text="r.name"></span>
                <b x-text="r.score.toLocaleString()"></b>
              </li>
            </template>
          </ol>

          <div class="over-actions">
            <button class="big" @click="play()">Play again</button>
            <button class="ghost" @click="share()" x-text="shared ? 'Copied!' : 'Share score'"></button>
          </div>
        </div>
      </div>
    </main>

    <div id="sheet-backdrop" x-show="sheet" x-transition.opacity @click="sheet = false"></div>
    <div id="sheet" x-show="sheet"
      x-transition:enter="sheet-enter"
      x-transition:enter-start="sheet-hidden"
      x-transition:enter-end="sheet-shown"
      x-transition:leave="sheet-leave"
      x-transition:leave-start="sheet-shown"
      x-transition:leave-end="sheet-hidden">
      <div class="sheet-card">
        <div class="grabber"></div>
        <div class="sheet-section">
          <span class="sheet-label">Sound</span>
          <div class="modes">
            <button :class="{active: !muted}" @click="setSound(true)">On</button>
            <button :class="{active: muted}" @click="setSound(false)">Off</button>
          </div>
        </div>
        <div class="sheet-section">
          <span class="sheet-label">Theme</span>
          <div class="theme-grid">
            <template x-for="t in ['colorful','pastels','catppuccin','crt']" :key="t">
              <button class="theme-opt" :class="{active: theme===t}" @click="pickTheme(t)">
                <span class="swatch" :class="t"></span><span x-text="t"></span>
              </button>
            </template>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    if ("serviceWorker" in navigator && location.hostname !== "localhost") {
      navigator.serviceWorker.register("/sw.js");
    }
  </script>
</body>
</html>
